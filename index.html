<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional 3D Login</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts: Outfit -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 3D Animated Background -->
    <div class="background-animation">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <div class="container d-flex justify-content-center align-items-center min-vh-100">
        <!-- 3D Tilt Card -->
        <div class="login-card p-5" id="tilt-card">
            <!-- Inner container pushed forward in 3D space -->
            <div class="card-inner">
                <div class="text-center mb-5">
                    <div class="logo-circle mb-3 mx-auto">
                        <i class="fa-solid fa-fingerprint fa-2x text-white"></i>
                    </div>
                    <h2 class="fw-bold text-white mb-1">Welcome Back</h2>
                    <p class="text-white-50 small">Please enter your details to sign in.</p>
                </div>

                <form id="loginForm" novalidate>
                    <!-- Email Field -->
                    <div class="mb-4 position-relative form-group">
                        <i class="fa-solid fa-envelope input-icon"></i>
                        <input type="email" class="form-control shadow-none" id="email" placeholder="Email address" required>
                        <div class="invalid-feedback">Please enter a valid email address.</div>
                        <div class="valid-feedback">Looks good!</div>
                    </div>

                    <!-- Password Field -->
                    <div class="mb-4 position-relative form-group">
                        <i class="fa-solid fa-lock input-icon"></i>
                        <input type="password" class="form-control shadow-none" id="password" placeholder="Password" required>
                        <i class="fa-regular fa-eye-slash toggle-password"></i>
                        <div class="invalid-feedback">Password cannot be empty.</div>
                    </div>

                    <!-- Options -->
                    <div class="d-flex justify-content-between align-items-center mb-5">
                        <div class="form-check custom-checkbox">
                            <input class="form-check-input shadow-none" type="checkbox" id="rememberMe">
                            <label class="form-check-label text-white-50 small" for="rememberMe">Remember me</label>
                        </div>
                        <a href="#" class="text-decoration-none small fw-semibold forgot-link">Forgot password?</a>
                    </div>

                    <!-- Submit Button -->
                    <button type="submit" class="btn btn-primary w-100 py-3 fw-bold login-btn">
                        <span>Sign In</span>
                        <i class="fa-solid fa-arrow-right ms-2 btn-icon"></i>
                    </button>
                </form>

                <div class="mt-4 text-center">
                    <p class="text-white-50 small mb-0">Don't have an account? <a href="#" class="text-decoration-none fw-semibold register-link">Register here</a></p>
                </div>
            </div>
        </div>
    </div>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS (MVC App) -->
    <script type="module" src="js/login/app.js"></script>
</body>
</html>
